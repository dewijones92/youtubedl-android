name: Quality

# Code-quality gates: no committed dewidebug logging, and a DRY ratchet
# (PMD CPD duplication count must not grow past ci/cpd-baseline).
on:
  push:
    branches: [master, api23-all-natives]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK (for PMD CPD)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21

      - name: Run quality gates
        run: ./ci/quality-check.sh
